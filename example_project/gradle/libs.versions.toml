[versions]
java = "25"
kotlin = "2.3.21"
gradle_publishing = "2.1.1"
idea_ext = "1.4.1"

junit = "6.1.2"

moddevgradle = "2.0.141" # https://projects.neoforged.net/neoforged/moddevgradle
fabric_loom = "1.17.17" # https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/
forge_gradle = "7.0.30" # https://maven.minecraftforge.net/net/minecraftforge/gradle/ForgeGradle/ - verify this is still the latest before relying on it
mod_publish = "2.2.0"

[libraries]
junit-parameterized-tests = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }

moddevgradle = { module = "net.neoforged.moddev:net.neoforged.moddev.gradle.plugin", version.ref = "moddevgradle" }
fabric_loom = { module = "net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin", version.ref = "fabric_loom" }
forge_gradle = { module = "net.minecraftforge.gradle:net.minecraftforge.gradle.gradle.plugin", version.ref = "forge_gradle" }
idea_ext = { module = "org.jetbrains.gradle.plugin.idea-ext:org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "idea_ext" }
mod_publish = { module = "me.modmuss50.mod-publish-plugin:me.modmuss50.mod-publish-plugin.gradle.plugin", version.ref = "mod_publish" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradle-publishing = { id = "com.gradle.plugin-publish", version.ref = "gradle_publishing" }
